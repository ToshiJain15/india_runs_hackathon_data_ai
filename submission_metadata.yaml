ai_usage_summary: |
  Used Gemini for code scaffolding, refactoring, background asset extraction, visual slide rendering, and automated PDF compilation. No candidate data was fed to any external LLM APIs.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Rule-based candidate scoring engine combining 5 dimensions: Skill Match (40%), Title + Career (25%), Years of Experience (15%), Education level and relevance (10%), and Platform Activity/Relocation Signals (10%). Features: (1) Dynamic JD Parser — paste any raw job description text to auto-extract skills, experience range, and role type for true multi-tenant operation. (2) Prodigy-Aware Scoring — PhD/Master's candidates with 0 YOE bypass the harsh junior penalty. (3) 4-check Honeypot Gate — impossible profiles zeroed to 0.0. (4) Consulting Firm Penalty — service-only career gets a 0.2x multiplier. (5) Production-ready Django deployment with PostgreSQL support via DATABASE_URL env var, CSRF protection, HSTS, WhiteNoise static serving, and Dockerfile. (6) Fully mobile-responsive UI with slide-in hamburger menu. Stream-loads 100K candidates line-by-line in under 50s on a single CPU core, using less than 500MB memory.

